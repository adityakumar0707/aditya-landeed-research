<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Landeed Pain Points Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f3f1;
    --card: #ffffff;
    --card-soft: #faf9f7;
    --border: #e4e1db;
    --border-strong: #d7d3ca;
    --text: #1c1b19;
    --text-dim: #5c5952;
    --text-faint: #8c887f;
    --accent: #5b3df0;
    --accent-hover: #4c2fe0;
    --accent-soft: #efecff;
    --accent-border: #d6ceff;
    --green: #16794f;
    --green-soft: #e6f5ed;
    --green-border: #bde3cc;
    --red: #b8402f;
    --red-soft: #fbebe8;
    --red-border: #eecac2;
    --amber: #9a6b00;
    --amber-soft: #fbf1dc;
    --amber-border: #edd9a3;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(28,27,25,0.05), 0 10px 24px -12px rgba(28,27,25,0.14);
    color-scheme: light;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
    background-image: radial-gradient(circle at 1px 1px, rgba(28,27,25,0.07) 1px, transparent 0);
    background-size: 24px 24px;
  }

  .wrap{ max-width:1240px; margin:0 auto; padding: clamp(20px,4vw,36px) clamp(16px,4vw,28px) 64px; }

  /* ---------- Header ---------- */
  .board-header{ margin-bottom: 26px; max-width: 680px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color: var(--accent); background: var(--accent-soft);
    border:1px solid var(--accent-border);
    padding:5px 12px; border-radius:999px; margin-bottom:14px;
  }
  .board-header h1{ margin:0 0 10px; font-size:clamp(24px,3.4vw,32px); font-weight:800; letter-spacing:-0.02em; line-height:1.15; }
  .board-header p{ margin:0; color:var(--text-dim); font-size:14.5px; line-height:1.6; }

  .legend{ display:flex; gap:18px; flex-wrap:wrap; margin: 0 0 22px; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); }
  .legend-dot{ width:8px; height:8px; border-radius:50%; flex:none; }

  /* ---------- Board grid ---------- */
  .board{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap:16px;
  }

  .pin-card{
    background: var(--card);
    border:1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    display:flex; flex-direction:column; gap:12px;
  }
  .pin-card:hover{
    border-color: var(--accent-border);
    box-shadow: 0 2px 4px rgba(28,27,25,0.06), 0 16px 30px -14px rgba(91,61,240,0.22);
    transform: translateY(-2px);
  }

  .pin-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .pin-num{
    width:26px; height:26px; border-radius:7px; flex:none;
    background: var(--card-soft); border:1px solid var(--border-strong);
    color: var(--text-dim); font-weight:700; font-size:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace;
  }
  .sev{
    font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 9px; border-radius:999px; white-space:nowrap;
  }
  .sev-critical{ color:var(--red); background:var(--red-soft); border:1px solid var(--red-border); }
  .sev-high{ color:var(--amber); background:var(--amber-soft); border:1px solid var(--amber-border); }
  .sev-medium{ color:#2a5f96; background:#e9f1fb; border:1px solid #c7dcf3; }

  .pin-card h3{ margin:0; font-size:16px; font-weight:700; letter-spacing:-0.01em; line-height:1.35; }
  .pin-card .issue{ margin:0; font-size:13px; color:var(--text-dim); line-height:1.55; }
  .pin-quote{
    font-size:12px; color:var(--text-faint);
    border-left:2px solid var(--border-strong); padding-left:10px; line-height:1.5;
  }
  .pin-meta{ font-size:11.5px; color:var(--text-faint); }

  .cta-btn{
    margin-top:2px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    background: var(--accent);
    color:#fff; border:none; border-radius: var(--radius-md);
    padding: 11px 16px; font-size:13.5px; font-weight:700; font-family:inherit;
    cursor:pointer; transition: background .15s ease;
  }
  .cta-btn:hover{ background: var(--accent-hover); }
  .cta-btn:active{ transform: scale(0.99); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(24,22,18,0.45);
    z-index:100; opacity:0; pointer-events:none;
    transition: opacity .18s ease;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding: 32px 20px;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .modal{
    width:100%; max-width: 820px;
    margin: 0 auto;
    background: var(--card);
    border:1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 30px 70px -30px rgba(28,27,25,0.45);
    overflow:hidden;
    transform: scale(0.98) translateY(6px);
    transition: transform .2s ease;
  }
  .overlay.open .modal{ transform: scale(1) translateY(0); }

  .modal-head{
    position:sticky; top:0; z-index:5;
    background: var(--card); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding: 12px 16px;
  }
  .modal-head .mh-title{ font-size:13px; font-weight:700; color:var(--text-dim); flex:1 1 auto; min-width:100px; }
  .tabs{ display:flex; background: var(--card-soft); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; flex:none; }
  .tab-btn{
    border:none; background:transparent; color:var(--text-faint);
    font-family:inherit; font-size:12px; font-weight:700; padding:7px 14px;
    border-radius:999px; cursor:pointer;
  }
  .tab-btn.active{ background: var(--accent); color:#fff; }
  .tab-btn.before-active{ background: var(--red); color:#fff; }
  .close-btn{
    flex:none; width:30px; height:30px; border-radius:50%;
    background: var(--card-soft); border:1px solid var(--border); color:var(--text-dim);
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .close-btn:hover{ color:var(--text); border-color:var(--border-strong); }

  .modal-body{ display:grid; grid-template-columns: 1fr 320px; }

  .modal-info{ padding:20px 22px 26px; }
  .modal-info h2{ margin:0 0 10px; font-size:19px; font-weight:800; letter-spacing:-0.01em; }
  .modal-info .desc{ font-size:13.5px; color:var(--text-dim); line-height:1.6; margin:0 0 16px; }

  .fix-box{
    background: var(--green-soft); border:1px solid var(--green-border);
    border-radius: var(--radius-md); padding:13px 15px; margin-bottom:12px;
  }
  .fix-box .lbl{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--green); margin-bottom:5px; }
  .fix-box p{ margin:0; font-size:13px; color:#155c3d; line-height:1.55; }

  .before-box{
    background: var(--red-soft); border:1px solid var(--red-border);
    border-radius: var(--radius-md); padding:13px 15px; margin-bottom:16px;
  }
  .before-box .lbl{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--red); margin-bottom:5px; }
  .before-box p{ margin:0; font-size:13px; color:#8a3325; line-height:1.55; }

  .phone-pane{
    background: var(--card-soft);
    border-left:1px solid var(--border);
    display:flex; align-items:flex-start; justify-content:center;
    padding: 24px 16px;
  }

  .phone{
    width:100%; max-width:290px;
    background: #fff;
    border-radius: 30px; border:9px solid #1f2430;
    box-shadow: 0 20px 40px -18px rgba(28,27,25,0.35);
    overflow:hidden; position:relative;
  }
  .phone-notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:100px; height:18px; background:#1f2430; border-radius:0 0 12px 12px; z-index:3;
  }
  .phone-status{
    display:flex; justify-content:space-between; padding:12px 18px 2px; font-size:10.5px;
    color:#1c1b19; font-weight:700; font-family:'JetBrains Mono',monospace;
  }
  .phone-screen{ padding: 8px 16px 22px; }

  /* ---------- Reusable in-phone UI atoms ---------- */
  .scr-title{ font-size:16px; font-weight:800; margin: 6px 0 4px; letter-spacing:-0.01em; }
  .scr-sub{ font-size:12px; color:var(--text-dim); margin:0 0 14px; line-height:1.5; }

  .field{
    background: var(--card-soft); border:1.5px solid var(--border-strong);
    border-radius: 11px; padding: 12px 13px; margin-bottom:10px;
    font-size:13.5px; color:var(--text); width:100%; font-family:inherit;
    outline:none; transition: border-color .15s ease;
  }
  .field:focus{ border-color: var(--accent); }
  .field::placeholder{ color:var(--text-faint); }
  .field:disabled{ color:var(--text-faint); }

  .dropdown{
    background: #fff; border:1px solid var(--border);
    border-radius:11px; margin:-4px 0 12px; overflow:hidden;
    box-shadow: var(--shadow);
  }
  .dd-row{
    display:flex; align-items:center; gap:10px; padding:10px 13px;
    font-size:13px; cursor:pointer; border-bottom:1px solid var(--border);
  }
  .dd-row:last-child{ border-bottom:none; }
  .dd-row:hover{ background: var(--accent-soft); }
  .dd-row .main{ font-weight:600; color:var(--text); }
  .dd-row .sub{ font-size:11px; color:var(--text-faint); }

  .card-ui{
    background: var(--card-soft); border:1px solid var(--border);
    border-radius:13px; padding:13px 14px; margin-bottom:11px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--accent-soft); border:1px solid var(--accent-border);
    color: var(--accent); font-size:12px; font-weight:700;
    padding:7px 12px; border-radius:999px; cursor:pointer; margin:3px 5px 3px 0;
  }
  .chip.static{ cursor:default; }
  .chip.warn{ background:var(--amber-soft); border-color:var(--amber-border); color:var(--amber); }
  .chip.done{ background: var(--green-soft); border-color:var(--green-border); color:var(--green); }

  .btn-primary{
    width:100%; background: var(--accent);
    color:#fff; border:none; border-radius:12px; padding:12px; font-size:13.5px;
    font-weight:700; font-family:inherit; cursor:pointer; margin-top:6px;
  }
  .btn-primary:hover{ background: var(--accent-hover); }
  .btn-secondary{
    width:100%; background: #fff; border:1px solid var(--border-strong);
    color:var(--text); border-radius:12px; padding:12px; font-size:13px;
    font-weight:600; font-family:inherit; cursor:pointer; margin-top:8px;
  }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary.danger{ background: var(--red); }

  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .small-note{ font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-top:8px; }

  .switch{ position:relative; width:40px; height:23px; flex:none; }
  .switch input{ display:none; }
  .switch .track{ position:absolute; inset:0; background:var(--border-strong); border-radius:999px; transition:.2s; }
  .switch .thumb{ position:absolute; top:3px; left:3px; width:17px; height:17px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked + .track{ background: var(--accent); }
  .switch input:checked + .track .thumb{ transform: translateX(17px); }

  .stage-list{ display:flex; flex-direction:column; gap:11px; margin:13px 0; }
  .stage{ display:flex; align-items:center; gap:10px; }
  .stage .dot{ width:20px; height:20px; border-radius:50%; background:var(--card-soft); border:2px solid var(--border-strong); flex:none; display:flex; align-items:center; justify-content:center; font-size:10px; }
  .stage.active .dot{ border-color: var(--accent); background: var(--accent-soft); }
  .stage.done .dot{ border-color: var(--green); background: var(--green-soft); color:var(--green); }
  .stage .label{ font-size:12.5px; color:var(--text-faint); font-weight:600; }
  .stage.active .label{ color:var(--text); }
  .stage.done .label{ color:var(--text-dim); }
  .progress-track{ height:6px; background:var(--card-soft); border:1px solid var(--border); border-radius:999px; overflow:hidden; margin:12px 0; }
  .progress-fill{ height:100%; background: var(--accent); width:0%; transition: width .3s linear; }

  .flash{ animation: flashIn .25s ease; }
  @keyframes flashIn{ from{ opacity:0; transform:translateY(5px);} to{ opacity:1; transform:translateY(0);} }

  @media (max-width: 760px){
    .wrap{ padding-left:16px; padding-right:16px; }
    .overlay{ padding:0; }
    .modal{ max-width:100%; min-height:100vh; min-height:100dvh; border-radius:0; }
    .modal-body{ grid-template-columns: 1fr; }
    .phone-pane{ border-left:none; border-top:1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="board-header">
    <div class="eyebrow">Landeed UX audit</div>
    <h1>Pain points, mapped to fixes</h1>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#b8402f"></span> Critical: blocks the task or causes billing complaints</div>
    <div class="legend-item"><span class="legend-dot" style="background:#9a6b00"></span> High: major friction, no way to recover</div>
    <div class="legend-item"><span class="legend-dot" style="background:#2a5f96"></span> Medium: hurts trust or accuracy</div>
  </div>

  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <span class="mh-title">Prototype</span>
      <div class="tabs" id="tabs">
        <button class="tab-btn before-active" data-tab="before" id="tabBefore">Before</button>
        <button class="tab-btn active" data-tab="after" id="tabAfter">After</button>
      </div>
      <button class="close-btn" id="closeBtn">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="modal-info" id="modalInfo"></div>
      <div class="phone-pane">
        <div class="phone">
          <div class="phone-notch"></div>
          <div class="phone-status"><span id="clockTime">9:41</span><span>5G 100%</span></div>
          <div class="phone-screen" id="phoneScreen"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- mock locality data ---------------- */
const LOCALITIES = [
  {loc:"Saket", city:"Delhi", state:"Delhi"},
  {loc:"Karol Bagh", city:"Delhi", state:"Delhi"},
  {loc:"Dwarka", city:"Delhi", state:"Delhi"},
  {loc:"Sarjapur", city:"Bengaluru", state:"Karnataka"},
  {loc:"Koramangala", city:"Bengaluru", state:"Karnataka"},
  {loc:"Whitefield", city:"Bengaluru", state:"Karnataka"},
  {loc:"Jayanagar", city:"Bengaluru", state:"Karnataka"},
  {loc:"Andheri", city:"Mumbai", state:"Maharashtra"},
  {loc:"Bandra", city:"Mumbai", state:"Maharashtra"},
  {loc:"Powai", city:"Mumbai", state:"Maharashtra"},
  {loc:"Banjara Hills", city:"Hyderabad", state:"Telangana"},
  {loc:"Gachibowli", city:"Hyderabad", state:"Telangana"},
  {loc:"Kukatpally", city:"Hyderabad", state:"Telangana"},
];
const ALIASES = { "bang":"bengaluru","bangalore":"bengaluru","blr":"bengaluru","beng":"bengaluru","bglr":"bengaluru",
  "bom":"mumbai","bombay":"mumbai","hyd":"hyderabad","del":"delhi","kar":"karnataka","karn":"karnataka","tel":"telangana","mah":"maharashtra" };

function resolveQuery(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const expand = ALIASES[q] || q;
  return LOCALITIES.filter(l =>
    l.loc.toLowerCase().includes(q) ||
    l.city.toLowerCase().includes(q) || l.city.toLowerCase().includes(expand) ||
    l.state.toLowerCase().includes(q) || l.state.toLowerCase().includes(expand)
  ).slice(0,5);
}
// old broken engine: only matches full state names, nothing else
const STATES = ["Delhi","Karnataka","Maharashtra","Telangana","Tamil Nadu","Uttar Pradesh","West Bengal","Gujarat"];
function oldStateMatch(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  return STATES.filter(s => s.toLowerCase().startsWith(q));
}

/* ---------------- pain point registry ---------------- */
const PAIN_POINTS = [
  {
    id:"search", sev:"critical", sevLabel:"Critical",
    title:"Search takes two steps",
    issue:"You search for a locality, then have to separately pick a state. The state list only matches state names, so typing a city like Bangalore finds nothing.",
    quote:"The user retyped Beng, Bang, Kai and Karn before finally picking Karnataka.",
    meta:"Seen from 2:20 to 3:12",
    fixLabel:"One search field. Type a locality and the state fills in on its own. No second screen.",
    before:"The state screen only matches exact state names. Bangalore, BLR and Beng all fail, so the user has to know and type the exact state name.",
  },
  {
    id:"deadend", sev:"high", sevLabel:"High",
    title:"No results is a dead end",
    issue:"When a search fails, every field is cleared. The only option is to start over from scratch.",
    quote:"The error blamed a change in survey or khata number, but gave no way to fix the search.",
    meta:"Seen from 1:35 to 2:20, right after the first search",
    fixLabel:"Show close matches you can tap, plus ways to browse nearby records or talk to support.",
    before:"A failed search clears everything you typed. There is no suggestion and no other way forward.",
  },
  {
    id:"wait", sev:"medium", sevLabel:"Medium",
    title:"Long wait with no idea how long",
    issue:"The search shows four stage labels but never says how long it will take.",
    quote:"The user left the app and went to the phone's home screen while still waiting.",
    meta:"Seen from 1:35 to 2:20",
    fixLabel:"Same four stages, now with a time estimate and a progress bar you can watch move.",
    before:"Stage labels change with no timer and no percentage, so there is no way to know how much longer it will take.",
  },
  {
    id:"mapfill", sev:"medium", sevLabel:"Medium",
    title:"Map location leaves blank fields",
    issue:"Dropping a pin fills in survey number, village, district and taluk on its own, but district sometimes comes back empty.",
    quote:"The confirm screen showed a single dot where the district name should be.",
    meta:"Seen from 3:40 to 3:47",
    fixLabel:"Flag any field that could not be filled in and let the user type it before confirming.",
    before:"A blank or broken field is shown the same way as the correct ones, with no flag and no way to fix it.",
  },
];

/* ---------------- render board ---------------- */
const board = document.getElementById('board');
PAIN_POINTS.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'pin-card';
  card.innerHTML = `
    <div class="pin-top">
      <div class="pin-num">${String(i+1).padStart(2,'0')}</div>
      <div class="sev sev-${p.sev}">${p.sevLabel}</div>
    </div>
    <h3>${p.title}</h3>
    <p class="issue">${p.issue}</p>
    <div class="pin-quote">${p.quote}</div>
    <div class="pin-meta">${p.meta}</div>
    <button class="cta-btn" data-open="${p.id}">View prototype</button>
  `;
  board.appendChild(card);
});

/* ---------------- modal plumbing ---------------- */
const overlay = document.getElementById('overlay');
const phoneScreen = document.getElementById('phoneScreen');
const modalInfo = document.getElementById('modalInfo');
const tabBefore = document.getElementById('tabBefore');
const tabAfter = document.getElementById('tabAfter');
let currentPP = null;
let currentTab = 'after';
let timers = [];

function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers.forEach(t=>clearInterval(t)); timers = []; }

function openModal(id){
  currentPP = PAIN_POINTS.find(p=>p.id===id);
  currentTab = 'after';
  renderInfo();
  renderTabs();
  renderScreen();
  overlay.classList.add('open');
  overlay.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  overlay.classList.remove('open');
  clearTimers();
  document.body.style.overflow = '';
}
document.getElementById('closeBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

board.addEventListener('click', e => {
  const btn = e.target.closest('[data-open]');
  if(btn) openModal(btn.dataset.open);
});

function renderInfo(){
  const p = currentPP;
  modalInfo.innerHTML = `
    <div class="row-between" style="margin-bottom:12px;">
      <span class="sev sev-${p.sev}">${p.sevLabel}</span>
      <span class="pin-meta">${p.meta}</span>
    </div>
    <h2>${p.title}</h2>
    <p class="desc">${p.issue}</p>
    <div class="before-box">
      <div class="lbl">Before</div>
      <p>${p.before}</p>
    </div>
    <div class="fix-box">
      <div class="lbl">Fix in this prototype</div>
      <p>${p.fixLabel}</p>
    </div>
  `;
}

function renderTabs(){
  tabBefore.classList.toggle('active', currentTab==='before');
  tabBefore.classList.toggle('before-active', currentTab==='before');
  tabAfter.classList.toggle('active', currentTab==='after');
}
tabBefore.addEventListener('click', ()=>{ currentTab='before'; clearTimers(); renderTabs(); renderScreen(); });
tabAfter.addEventListener('click', ()=>{ currentTab='after'; clearTimers(); renderTabs(); renderScreen(); });

function renderScreen(){
  clearTimers();
  const fn = SCREENS[currentPP.id][currentTab];
  phoneScreen.innerHTML = '';
  fn(phoneScreen);
}

/* ================================================================
   SCREEN BUILDERS. Each pain point gets a Before and an After render fn.
   ================================================================ */
const SCREENS = {};

/* ---------- 1. SEARCH ---------- */
SCREENS.search = {
  before(root){
    root.innerHTML = `
      <div class="scr-title flash">Property search</div>
      <div class="scr-sub">Step 1 of 2. Enter a locality, then pick a state next.</div>
      <input class="field" placeholder="Locality or area" value="Saket" disabled>
      <button class="btn-primary" id="goState">Search</button>
      <div id="stateStep" style="display:none; margin-top:16px;">
        <div class="scr-title" style="font-size:14px;">Select a state</div>
        <input class="field" id="stateQ" placeholder="Type a state name" autocomplete="off">
        <div id="stateDD"></div>
        <div class="small-note" id="stateNote">Try typing Bangalore. Watch it fail.</div>
      </div>
    `;
    root.querySelector('#goState').onclick = ()=>{
      root.querySelector('#stateStep').style.display='block';
      root.querySelector('#stateQ').focus();
    };
    const dd = root.querySelector('#stateDD');
    root.querySelector('#stateQ').addEventListener('input', e=>{
      const matches = oldStateMatch(e.target.value);
      const note = root.querySelector('#stateNote');
      if(!e.target.value){ dd.innerHTML=''; note.textContent='Try typing Bangalore. Watch it fail.'; note.style.color=''; return; }
      if(matches.length===0){
        dd.innerHTML = `<div class="dropdown"><div class="dd-row" style="color:var(--red)">No matching state</div></div>`;
        note.innerHTML = `You typed "${e.target.value}". City names are not recognized here. You need to know and type the exact state name.`;
        note.style.color = 'var(--red)';
      } else {
        dd.innerHTML = `<div class="dropdown">${matches.map(s=>`<div class="dd-row"><span class="main">${s}</span></div>`).join('')}</div>`;
        note.textContent = 'Only works if you already know the exact state name.';
        note.style.color = '';
      }
    });
  },
  after(root){
    root.innerHTML = `
      <div class="scr-title flash">Search anything</div>
      <div class="scr-sub">One field for locality, survey number or owner name. The state fills in on its own.</div>
      <input class="field" id="uq" placeholder="Search Saket, Sarjapur or a survey no." autocomplete="off">
      <div id="uDD"></div>
      <div id="uResolved"></div>
      <div class="small-note">Try typing Bangalore. It finds Karnataka localities right away, no second screen.</div>
    `;
    const dd = root.querySelector('#uDD');
    const resolved = root.querySelector('#uResolved');
    root.querySelector('#uq').addEventListener('input', e=>{
      resolved.innerHTML='';
      const matches = resolveQuery(e.target.value);
      if(!e.target.value.trim()){ dd.innerHTML=''; return; }
      if(matches.length===0){
        dd.innerHTML = `<div class="dropdown"><div class="dd-row">No exact match. Try a nearby locality.</div></div>`;
        return;
      }
      dd.innerHTML = `<div class="dropdown">${matches.map(m=>`
        <div class="dd-row" data-loc="${m.loc}" data-city="${m.city}" data-state="${m.state}">
          <div><div class="main">${m.loc}</div><div class="sub">${m.city}, ${m.state}</div></div>
        </div>`).join('')}</div>`;
      dd.querySelectorAll('.dd-row').forEach(row=>{
        row.onclick = ()=>{
          dd.innerHTML='';
          root.querySelector('#uq').value = `${row.dataset.loc}, ${row.dataset.city}`;
          resolved.innerHTML = `
            <div class="card-ui flash">
              <div class="row-between"><b style="font-size:13px;">Resolved</b><span class="chip done static">no extra screen</span></div>
              <div style="margin-top:8px; font-size:14px; font-weight:700;">${row.dataset.loc}, ${row.dataset.city}, ${row.dataset.state}</div>
              <div class="small-note">The state was filled in automatically from the locality you typed.</div>
            </div>`;
        };
      });
    });
  }
};

/* ---------- 2. DEAD END ---------- */
SCREENS.deadend = {
  before(root){
    root.innerHTML = `
      <div class="scr-title flash">No results found</div>
      <div class="scr-sub">We could not find a document for this property. This may be due to a change in survey or khata number.</div>
      <div class="card-ui" style="text-align:center; padding:24px 14px; color:var(--text-faint);">Your search has been cleared.</div>
      <button class="btn-primary danger" id="reset">New search</button>
      <div class="small-note">The only option is a full reset. Everything you typed is gone.</div>
    `;
    root.querySelector('#reset').onclick = ()=>{
      root.querySelector('.scr-sub').textContent = 'All fields cleared, including the parts you spelled correctly.';
    };
  },
  after(root){
    root.innerHTML = `
      <div class="scr-title flash">No exact match</div>
      <div class="scr-sub">You searched for "Sarjpur". Here is what is close:</div>
      <div class="card-ui">
        <div class="small-note" style="margin-top:0; margin-bottom:8px;">Did you mean:</div>
        <span class="chip" data-fix="Sarjapur, Bengaluru, Karnataka">Sarjapur, Bengaluru</span>
        <span class="chip" data-fix="Whitefield, Bengaluru, Karnataka">Whitefield, Bengaluru</span>
      </div>
      <button class="btn-secondary" id="browse">Browse nearby records</button>
      <button class="btn-secondary" id="support">Contact support</button>
      <div id="afterResult"></div>
    `;
    const result = root.querySelector('#afterResult');
    root.querySelectorAll('.chip[data-fix]').forEach(c=>{
      c.onclick = ()=>{
        result.innerHTML = `<div class="card-ui flash"><b style="font-size:13px;">Found:</b> ${c.dataset.fix}<div class="small-note">Fixed in one tap. No retyping needed.</div></div>`;
      };
    });
    root.querySelector('#browse').onclick = ()=>{ result.innerHTML = `<div class="card-ui flash">Showing 4 verified records near your last search.</div>`; };
    root.querySelector('#support').onclick = ()=>{ result.innerHTML = `<div class="card-ui flash">Connecting you to support. Your search is kept, not lost.</div>`; };
  }
};

/* ---------- 3. WAIT TIME ---------- */
const STAGES = ["Connecting","Searching","Verifying","Preparing"];
SCREENS.wait = {
  before(root){
    root.innerHTML = `
      <div class="scr-title flash">Processing</div>
      <div class="scr-sub">No time estimate, just a stage name.</div>
      <div class="stage-list">${STAGES.map((s,i)=>`<div class="stage" data-i="${i}"><div class="dot"></div><div class="label">${s}</div></div>`).join('')}</div>
      <div class="small-note" id="waitNote">Elapsed: 0s. No idea how much longer.</div>
      <button class="btn-secondary" id="startB">Start search</button>
    `;
    let i=-1, t=0;
    root.querySelector('#startB').onclick = ()=>{
      root.querySelector('#startB').disabled = true;
      const stages = root.querySelectorAll('.stage');
      const note = root.querySelector('#waitNote');
      const iv = setInterval(()=>{
        t++;
        note.textContent = `Elapsed: ${t}s. Still no time estimate.`;
        if(t % 3 === 0 && i < stages.length-1){
          if(i>=0) stages[i].classList.replace('active','done');
          i++; stages[i].classList.add('active');
        }
      }, 700);
      timers.push(iv);
    };
  },
  after(root){
    root.innerHTML = `
      <div class="scr-title flash">Processing</div>
      <div class="scr-sub">Usually takes 15 to 20 seconds while we fetch from Karnataka Land Records.</div>
      <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
      <div class="stage-list">${STAGES.map((s,i)=>`<div class="stage" data-i="${i}"><div class="dot"></div><div class="label">${s}</div></div>`).join('')}</div>
      <div class="row-between card-ui">
        <span style="font-size:12.5px;">Notify me when ready</span>
        <label class="switch"><input type="checkbox" checked><span class="track"><span class="thumb"></span></span></label>
      </div>
      <button class="btn-secondary" id="startA">Start search</button>
      <div id="doneMsg"></div>
    `;
    root.querySelector('#startA').onclick = ()=>{
      root.querySelector('#startA').disabled = true;
      const stages = root.querySelectorAll('.stage');
      const fill = root.querySelector('#pfill');
      let i=-1, pct=0;
      const iv = setInterval(()=>{
        pct += 100/18;
        fill.style.width = Math.min(pct,100)+'%';
        if(pct/100*18 % 4.5 < 1 && i < stages.length-1){
          if(i>=0) stages[i].classList.replace('active','done');
          i++; stages[i].classList.add('active');
        }
        if(pct>=100){
          clearInterval(iv);
          stages[stages.length-1].classList.replace('active','done');
          root.querySelector('#doneMsg').innerHTML = `<div class="card-ui flash">Done. Right on estimate.</div>`;
        }
      }, 300);
      timers.push(iv);
    };
  }
};

/* ---------- 4. MAP AUTOFILL ---------- */
SCREENS.mapfill = {
  before(root){
    root.innerHTML = `
      <div class="scr-title flash">Confirm location</div>
      <div class="scr-sub">Filled in automatically from your map pin.</div>
      <div class="card-ui">
        <div class="row-between" style="margin-bottom:8px;"><span class="small-note" style="margin:0;">Survey no.</span><b style="font-size:13px;">108</b></div>
        <div class="row-between" style="margin-bottom:8px;"><span class="small-note" style="margin:0;">Village</span><b style="font-size:13px;">Havanura</b></div>
        <div class="row-between" style="margin-bottom:8px;"><span class="small-note" style="margin:0;">District</span><b style="font-size:13px; color:var(--text-faint);">.</b></div>
        <div class="row-between"><span class="small-note" style="margin:0;">Taluk</span><b style="font-size:13px;">Haveri</b></div>
      </div>
      <button class="btn-primary">Confirm location</button>
      <div class="small-note" style="color:var(--red);">The broken district value looks like real data. Nothing flags it and nothing lets you fix it.</div>
    `;
  },
  after(root){
    root.innerHTML = `
      <div class="scr-title flash">Confirm location</div>
      <div class="scr-sub">Filled in automatically from your map pin.</div>
      <div class="card-ui">
        <div class="row-between" style="margin-bottom:8px;"><span class="small-note" style="margin:0;">Survey no.</span><b style="font-size:13px;">108</b></div>
        <div class="row-between" style="margin-bottom:10px;"><span class="small-note" style="margin:0;">Village</span><b style="font-size:13px;">Havanura</b></div>
        <div class="row-between" style="margin-bottom:10px;">
          <span class="small-note" style="margin:0;">District</span>
          <span class="chip warn">Not detected</span>
        </div>
        <input class="field" id="distIn" placeholder="Type the district" style="margin-bottom:0;">
        <div class="row-between" style="margin-top:10px;"><span class="small-note" style="margin:0;">Taluk</span><b style="font-size:13px;">Haveri</b></div>
      </div>
      <button class="btn-primary" id="confirmB">Confirm location</button>
      <div id="mapOk"></div>
    `;
    root.querySelector('#confirmB').onclick = ()=>{
      const v = root.querySelector('#distIn').value.trim();
      root.querySelector('#mapOk').innerHTML = `<div class="card-ui flash">${v? `District set to "${v}" by hand.` : 'Missing field flagged. You knew before confirming, not after.'}</div>`;
    };
  }
};

/* clock */
function tick(){ document.getElementById('clockTime').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}); }
tick(); setInterval(tick, 30000);
</script>
